name: Bright Slots – Android APK

on:
  push:
    branches: [main]
    paths: ['bright-slots/**', '.github/workflows/bright-slots-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bright-slots
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Render app icon and splash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon-only.png
          sed '/<rect width="1024"/d' assets/icon.svg > assets/fg.svg
          rsvg-convert --page-width 1024 --page-height 1024 --left 192 --top 192 -w 640 -h 640 assets/fg.svg -o assets/icon-foreground.png
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><defs><radialGradient id="b" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#b3213a"/><stop offset="1" stop-color="#4a0b15"/></radialGradient></defs><rect width="1024" height="1024" fill="url(#b)"/></svg>' > assets/bg.svg
          rsvg-convert -w 1024 -h 1024 assets/bg.svg -o assets/icon-background.png
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/splash.png
          cp assets/splash.png assets/splash-dark.png

      - name: Add Android platform
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#5b0f1a' --splashBackgroundColor '#5b0f1a' --splashBackgroundColorDark '#2a060c'
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../BrightSlots.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BrightSlots-apk
          path: bright-slots/BrightSlots.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: slots-v1.0.${{ github.run_number }}
          name: Bright Slots v1.0.${{ github.run_number }}
          body: Descarcă BrightSlots.apk pe telefon și instalează-l (permite „surse necunoscute” dacă îți cere).
          files: bright-slots/BrightSlots.apk
